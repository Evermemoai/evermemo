name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that evermemo doesn't support?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Which interfaces (CLI/API/MCP) does it touch?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
